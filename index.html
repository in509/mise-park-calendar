const DAY_LO=480, DAY_HI=1320;               // 8:00–22:00 的默认画幅
const WD=['周日','周一','周二','周三','周四','周五','周六'];
const m=t=>+t.slice(0,2)*60 + +t.slice(3,5);
const t2=n=>String(n/60|0).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const fmt=n=>{const h=n/60|0,x=n%60;return ((h?h+'小时':'')+(x?x+'分':''))||'0'};
const dObj=s=>new Date(s+'T12:00:00');
const label=s=>{const d=dObj(s);return (d.getMonth()+1)+'月'+d.getDate()+'日 '+WD[d.getDay()]};
const shortLbl=s=>{const d=dObj(s);return (d.getMonth()+1)+'/'+d.getDate()};
const rName=id=>(D.resources.find(r=>r.id===id)||{}).name||id;

document.getElementById('sub').textContent =
  `已累积 ${D.snapshotCount} 天快照（自 ${D.firstSnapshot}）· 最后更新 ${D.generated.slice(0,16).replace('T',' ')}`;

const sel=document.getElementById('res');
D.resources.forEach(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.name;sel.appendChild(o)});

// 一天的画幅：默认 8:00–22:00，若某天空档超出这个范围就撑开
function spanOf(freeLists){
  let lo=DAY_LO, hi=DAY_HI;
  freeLists.forEach(f=>f.forEach(([a,b])=>{lo=Math.min(lo,m(a));hi=Math.max(hi,m(b))}));
  return [lo,hi];
}
// 占用 = 画幅减去空档
function busyOf(free,lo,hi){
  const out=[]; let cur=lo;
  free.slice().sort((x,y)=>m(x[0])-m(y[0])).forEach(([a,b])=>{
    if(m(a)>cur) out.push([cur,m(a)]);
    cur=Math.max(cur,m(b));
  });
  if(cur<hi) out.push([cur,hi]);
  return out;
}
function dayList(){
  const back=+document.getElementById('past').value;
  const out=[], t=dObj(D.today);
  for(let i=-back;i<=D.daysAhead;i++){
    const d=new Date(t); d.setDate(d.getDate()+i);
    out.push(d.toISOString().slice(0,10));
  }
  return out;
}
function cellFor(rid,date){
  const live=(D.latest[rid]||{})[date];
  if(live && live.status===0) return {free:live.free, stale:null};
  const lv=(D.lastVisible[rid]||{})[date];
  if(lv) return {free:lv.free, stale:lv.snap};
  return null;
}
function ruler(lo,hi){
  const ls=[]; for(let t=lo;t<hi;t+=240) ls.push(t); ls.push(hi);
  const sp=hi-lo;
  return `<div class="ruler"><div></div><div class="rl">`+ls.map((t,i)=>
    `<span class="${i===0?'first':i===ls.length-1?'last':''}" style="left:${(t-lo)/sp*100}%">${t2(t)}</span>`
  ).join('')+`</div></div>`;
}
function bar(free,lo,hi){
  const sp=hi-lo;
  let h='<div class="bar">';
  for(let t=lo+120;t<hi;t+=120) h+=`<span class="tick" style="left:${(t-lo)/sp*100}%"></span>`;
  busyOf(free,lo,hi).forEach(([a,b])=>{
    h+=`<span class="seg" style="left:${(a-lo)/sp*100}%;width:${(b-a)/sp*100}%"></span>`;
  });
  return h+'</div>';
}

function renderCal(){
  const weekend=document.getElementById('weekend').checked;
  const hasfree=document.getElementById('hasfree').checked;
  const mind=+document.getElementById('mindur').value;
  const only=sel.value;
  const rs=D.resources.filter(r=>!only||r.id===only);
  let html='', shown=0;
  for(const date of dayList()){
    const wd=dObj(date).getDay();
    if(weekend && wd!==0 && wd!==6) continue;
    const cells=rs.map(r=>[r,cellFor(r.id,date)]).filter(x=>x[1]);
    if(!cells.length) continue;
    if(hasfree && !cells.some(([,c])=>c.free.some(([a,b])=>m(b)-m(a)>=mind))) continue;
    shown++;
    const [lo,hi]=spanOf(cells.map(([,c])=>c.free));
    const stale=cells.every(([,c])=>c.stale);
    html+=`<div class="day${stale?' stale':''}"><div class="dhead">
      <span class="dtitle${wd===0||wd===6?' we':''}">${label(date)}</span>`;
    if(stale) html+=`<span class="badge">${date<D.today?'已过去':'封锁期'} · ${shortLbl(cells[0][1].stale)} 的快照</span>`;
    html+=`<span class="dmeta">${date}</span></div>`+ruler(lo,hi);
    for(const [r,c] of cells){
      const busy=busyOf(c.free,lo,hi);
      const good=c.free.filter(([a,b])=>m(b)-m(a)>=mind);
      html+=`<div class="row"><div class="rname" title="${r.name}">${r.name}</div>${bar(c.free,lo,hi)}</div>
        <div class="lines">`;
      html+= busy.length
        ? `<div class="l-occ">占用 ${busy.map(([a,b])=>t2(a)+'–'+t2(b)).join('、')} <span class="q">共 ${fmt(busy.reduce((s,[a,b])=>s+b-a,0))}</span></div>`
        : `<div class="l-free">全天无人占用</div>`;
      html+= good.length
        ? `<div class="l-free">空 ${good.map(([a,b])=>a+'–'+b).join('、')}</div>`
        : (busy.length?`<div class="l-free">没有 ≥${mind} 分钟的整段空档</div>`:'');
      html+=`</div>`;
    }
    html+='</div>';
  }
  document.getElementById('days').innerHTML = shown? html :
    '<div class="empty">没有符合条件的日期，放宽一下筛选试试。</div>';
}

function renderChg(){
  const el=document.getElementById('v-chg');
  if(!D.prevSnapshot){el.innerHTML='<div class="empty">还只有一份快照，明天再跑一次就能看出变化了。</div>';return}
  if(!D.changes.length){el.innerHTML=`<div class="empty">跟 ${D.prevSnapshot} 相比没有任何变化。</div>`;return}
  let h=`<div class="legend">对比 ${D.prevSnapshot} → ${D.today}</div>`;
  const by={};
  D.changes.forEach(c=>{(by[c.date]=by[c.date]||[]).push(c)});
  Object.keys(by).sort().forEach(date=>{
    h+=`<div class="chg"><div class="dhead"><span class="dtitle">${label(date)}</span></div>`;
    by[date].forEach(c=>{
      if(c.booked.length) h+=`<div class="chgline booked">● ${rName(c.rid)} 新增占用 ${c.booked.map(([a,b])=>a+'–'+b).join('、')}</div>`;
      if(c.freed.length) h+=`<div class="chgline freed">○ ${rName(c.rid)} 释放出来 ${c.freed.map(([a,b])=>a+'–'+b).join('、')}</div>`;
    });
    h+='</div>';
  });
  el.innerHTML=h;
}

document.getElementById('doc').innerHTML=`
<h3>怎么看</h3>
<p><strong style="color:var(--occink)">红色 = 已被占用</strong>，浅色底 = 还空着。画幅默认是场地开放时间 8:00–22:00，
个别日期空档超出这个范围时会自动撑开。</p>
<p>注意：接口给的是<strong>空闲</strong>时段，红色的占用是用「开放时间减去空闲」算出来的。
所以「占用」严格说是「不可预订」—— 可能是别人订走了，也可能是场地维护或封场。</p>
<h3>这个页面在解决什么问题</h3>
<p>预订网站规定「至少提前 4 天」，服务器对今天起 4 天内的日期直接返回空数据 —— 不是前端藏起来，是查不到。
所以只能每天抓一次快照。存够之后，封锁期内的日期就能显示<strong>它最后一次可见时的样子</strong>（虚线框那些）。</p>
<h3>数据在哪</h3>
<ul>
<li><code>data/snapshot-YYYY-MM-DD.json</code> — 每天一份原始快照，只增不改</li>
<li><code>history.csv</code> — 所有快照摊平成表格，可以直接拖进 Excel</li>
<li><code>index.html</code> — 就是这个页面，每次抓取后重新生成</li>
</ul>
<h3>状态码</h3>
<ul><li><code>0</code> 可订（times 里是空闲时段）</li><li><code>7</code> 未满 4 天，被封锁</li>
<li><code>5</code> 已过期</li><li><code>8</code> 超过 365 天</li></ul>
<h3>改抓取频率</h3>
<p>编辑 <code>~/Library/LaunchAgents/com.yi.mise-calendar.plist</code> 里的 <code>StartCalendarInterval</code>，
然后 <code>launchctl unload</code> 再 <code>load</code> 一次。</p>
<h3>改场地或天数</h3>
<p>编辑 <code>fetch_mise.py</code> 顶部的 <code>RESOURCES</code> 和 <code>DAYS_AHEAD</code>。</p>`;

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x===b));
  ['cal','chg','doc'].forEach(v=>document.getElementById('v-'+v).hidden = v!==b.dataset.v);
});
['weekend','hasfree','mindur','res','past'].forEach(id=>document.getElementById(id).onchange=renderCal);
renderCal(); renderChg();
</script></body></html>
